<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Mikky | VSES.cloud</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter, sans-serif;
    background:#05060a;
    color:#fff;
    overflow-x:hidden;
}

/* NOISE + GLOW BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 15% 20%, rgba(120,120,255,0.12), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(255,255,255,0.06), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(120,255,200,0.08), transparent 45%),
        #05060a;
    z-index:0;
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:60px 60px;
    opacity:0.05;
}

/* CURSOR GLOW */
.cursor{
    position:fixed;
    width:220px;
    height:220px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle, rgba(120,180,255,0.15), transparent 60%);
    transform:translate(-50%,-50%);
    transition:transform 0.08s linear;
    z-index:1;
}

/* LAYOUT */
.container{
    width:min(1150px,92vw);
    margin:0 auto;
    position:relative;
    z-index:2;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:16px 0;
    background:rgba(10,12,18,0.55);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.06);
    z-index:1000;
}

.nav-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* ✅ CLICKABLE LOGO (ONLY CHANGE #1) */
.logo{
    font-size:11px;
    letter-spacing:0.35em;
    padding:7px 12px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:999px;
    color:#fff;
    background:rgba(255,255,255,0.02);
    cursor:pointer;
}

/* NAV RIGHT */
.nav-right{
    display:flex;
    gap:26px;
}

.nav-right a{
    font-size:13px;
    color:rgba(255,255,255,0.65);
    text-decoration:none;
    transition:0.2s;
}

.nav-right a:hover{
    color:#fff;
}

/* HERO */
.hero{
    padding:180px 0 100px;
}

.hero h1{
    font-size:clamp(44px,5.2vw,84px);
    line-height:1.02;
    letter-spacing:-0.04em;
}

.hero h1 span{
    background:linear-gradient(90deg,#8aa7ff,#7cf7d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    margin-top:18px;
    max-width:680px;
    color:rgba(255,255,255,0.65);
    font-size:16px;
    line-height:1.7;
}

/* SECTION */
.section{
    padding:110px 0;
}

/* VIDEO */
.video-box{
    width:100%;
    max-width:920px;
    margin:0 auto;
    aspect-ratio:16/9;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
}

/* CONTACT LINKS */
.contact a{
    margin-right:16px;
    color:rgba(255,255,255,0.7);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
}

/* ✅ ICON STYLE (ONLY CHANGE #2) */
.icon{
    width:16px;
    height:16px;
    fill:currentColor;
}

/* FOOTER */
footer{
    border-top:1px solid rgba(255,255,255,0.08);
    padding:18px 0;
    color:rgba(255,255,255,0.4);
    font-size:12px;
}

/* REVEAL */
.reveal{
    opacity:0;
    transform:translateY(18px);
    transition:0.9s ease;
}

.reveal.visible{
    opacity:1;
    transform:translateY(0);
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="cursor" id="cursor"></div>

<nav>
<div class="container nav-inner">

    <!-- CLICK TO RELOAD -->
    <div class="logo" onclick="window.location.reload()">PROJECT MIKKY</div>

    <div class="nav-right">
        <a href="#video">Video</a>
        <a href="#products">Product</a>
        <a href="#infra">Infra</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </div>

</div>
</nav>

<!-- HERO -->
<section class="hero container reveal">
    <h1><span>VSES.cloud</span> infrastructure for email systems.</h1>
    <p>Production SMTP infrastructure, DNS automation, routing control, and deliverability systems.</p>
</section>

<!-- CONTACT -->
<section id="contact" class="section container reveal contact">
    <h2>Contact</h2>

    <div style="margin-top:14px;">

        <a href="mailto:michael@projectmikky.com">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            Email
        </a>

        <a href="https://wa.me/2349040000902">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 3.5A11.8 11.8 0 0012 1C6.5 1 2 5.5 2 11c0 2 .6 3.9 1.7 5.5L2 23l6.7-1.7A11.9 11.9 0 0012 23c5.5 0 10-4.5 10-10 0-3-1.2-5.8-3-7.5z"/></svg>
            WhatsApp
        </a>

        <a href="tel:+2349040000902">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6.6 10.8a15.6 15.6 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C10.3 22 2 13.7 2 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2.2 2.2z"/></svg>
            Call
        </a>

        <a href="https://github.com/projectmikky/vses-cloud">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 .5C5.7.5.7 5.6.7 12c0 5.1 3.3 9.5 7.9 11 0.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 2-.7 2.5-1.1.1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11 11 0 016 0C16.8 4.4 17.8 4.7 17.8 4.7c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.7-5.4 6 .4.3.8 1 .8 2v3c0 .3.2.7.8.6 4.6-1.5 7.9-5.9 7.9-11C23.3 5.6 18.3.5 12 .5z"/></svg>
            GitHub
        </a>

    </div>
</section>

<footer>
<div class="container">
    © 2026 Project Mikky — VSES.cloud
</div>
</footer>

<script>
document.querySelector(".logo").onclick = () => window.location.reload();

const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
        if(e.isIntersecting) e.target.classList.add("visible");
    });
},{threshold:0.15});

document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));

document.addEventListener("mousemove",(e)=>{
    document.getElementById("cursor").style.transform=
    `translate(${e.clientX}px,${e.clientY}px)`;
});
</script>

</body>
</html>
